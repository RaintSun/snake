<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Auto Snake snake4.html</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#fff;font-family:Consolas,monospace;padding:10px}
#info{font-size:18px;margin-bottom:8px;line-height:1.5}
#control{margin-bottom:8px;}
button{padding:6px 12px;margin-right:8px;font-size:14px;cursor:pointer}
#game{border:2px solid #666;background:#000}
</style>
</head>
<body>
<div id="info">
局数: <span id="gameCount">0</span> |
本局得分: <span id="score">0</span> |
历史累计得分: <span id="totalScore">0</span>
</div>
<div id="control">
<button id="btnResetGame">重置本局</button>
<button id="btnClearStat">清空统计数据</button>
</div>
<canvas id="game" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const infoGameCount = document.getElementById('gameCount');
const infoScore = document.getElementById('score');
const infoTotalScore = document.getElementById('totalScore');
const btnResetGame = document.getElementById('btnResetGame');
const btnClearStat = document.getElementById('btnClearStat');

const gridSize = 20;
const cell = 20;
let snake, food, dir, nextDir, score;
let gameOver = false;

// 读取本地存储 局数、累计总分
let gameCount = Number(localStorage.getItem('snake_gameCount')) || 0;
let totalScore = Number(localStorage.getItem('snake_totalScore')) || 0;
infoGameCount.textContent = gameCount;
infoTotalScore.textContent = totalScore;

function rand(min,max){
  return Math.floor(Math.random()*(max-min)+min);
}

function resetGame(){
  gameOver = false;
  score = 0;
  dir = {x:1,y:0};
  nextDir = {...dir};
  snake = [ {x:2,y:1}, {x:1,y:1}, {x:0,y:1} ];
  spawnFood();
  updateScoreUI();
}

function spawnFood(){
  let ok = false;
  while(!ok){
    food = {x:rand(0,gridSize), y:rand(0,gridSize)};
    ok = !snake.some(p=>p.x===food.x&&p.y===food.y);
  }
}

function updateScoreUI(){
  infoScore.textContent = score;
  infoGameCount.textContent = gameCount;
  infoTotalScore.textContent = totalScore;
}

function draw(){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // 食物红色
  ctx.fillStyle="#f33";
  ctx.fillRect(food.x*cell, food.y*cell, cell-1, cell-1);
  // 蛇绿色
  ctx.fillStyle="#3a3";
  for(let p of snake){
    ctx.fillRect(p.x*cell, p.y*cell, cell-1, cell-1);
  }
}

function step(){
  if(gameOver) return;
  dir = {...nextDir};
  const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  // 撞墙检测
  if(head.x<0||head.x>=gridSize||head.y<0||head.y>=gridSize){
    endGame();
    return;
  }
  // 撞自己
  if(snake.some(p=>p.x===head.x&&p.y===head.y)){
    endGame();
    return;
  }
  snake.unshift(head);
  if(head.x===food.x && head.y===food.y){
    score += 10;
    spawnFood();
  }else{
    snake.pop();
  }
  updateScoreUI();
  draw();
}

// 游戏结束逻辑：统计本局并保存到localStorage
function endGame(){
  gameOver = true;
  // 本局结束：局数+1，分数计入累计
  gameCount += 1;
  totalScore += score;
  localStorage.setItem('snake_gameCount', gameCount);
  localStorage.setItem('snake_totalScore', totalScore);
  updateScoreUI();
  setTimeout(resetGame,1200);
}

// ========== 按钮事件 ==========
// 重置本局按钮：立刻结束当前对局，计入统计，马上开新局
btnResetGame.onclick = function(){
  if(!gameOver){
    endGame();
  }else{
    resetGame();
  }
};
// 清空统计按钮，带确认弹窗，防止误点
btnClearStat.onclick = function(){
  if(confirm("确定清空所有局数和累计得分？此操作不可恢复！")){
    localStorage.removeItem('snake_gameCount');
    localStorage.removeItem('snake_totalScore');
    gameCount = 0;
    totalScore = 0;
    updateScoreUI();
  }
};

// 键盘方向控制
document.addEventListener('keydown',e=>{
  if(gameOver) return;
  switch(e.key){
    case 'ArrowUp': if(dir.y!==1) nextDir={x:0,y:-1};break;
    case 'ArrowDown': if(dir.y!==-1) nextDir={x:0,y:1};break;
    case 'ArrowLeft': if(dir.x!==1) nextDir={x:-1,y:0};break;
    case 'ArrowRight': if(dir.x!==-1) nextDir={x:1,y:0};break;
  }
});

resetGame();
draw();
setInterval(step,130);
</script>
</body>
</html>
