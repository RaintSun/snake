<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>贪吃蛇</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{
            background:#111;
            display:flex;
            flex-direction:column;
            align-items:center;
            padding-top:30px;
            color:#fff;
        }
        #gameCanvas{
            border:2px solid #4cd964;
            background:#000;
        }
        .info{
            font-size:20px;
            margin-bottom:10px;
        }
    </style>
</head>
<body>
    <div class="info">当前分数：<span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDom = document.getElementById('score');

        const blockSize = 20;
        const count = canvas.width / blockSize;

        // 蛇数组，每个元素 {x,y}
        let snake = [{x:10, y:10}];
        let dx = 1, dy = 0;
        let food = {};
        let score = 0;
        let gameOver = false;
        let speed = 120; // 初始间隔ms

        // 生成食物
        function spawnFood(){
            return {
                x: Math.floor(Math.random() * count),
                y: Math.floor(Math.random() * count)
            }
        }
        food = spawnFood();

        // 键盘监听，禁止反向直接掉头
        document.addEventListener('keydown', e=>{
            if(gameOver) return;
            switch(e.key){
                case 'ArrowUp':
                    if(dy !== 1) {dx=0; dy=-1;}
                    break;
                case 'ArrowDown':
                    if(dy !== -1) {dx=0; dy=1;}
                    break;
                case 'ArrowLeft':
                    if(dx !== 1) {dx=-1; dy=0;}
                    break;
                case 'ArrowRight':
                    if(dx !== -1) {dx=1; dy=0;}
                    break;
            }
        })

        function draw(){
            // 清画布
            ctx.fillStyle="#000";
            ctx.fillRect(0,0,canvas.width,canvas.height);

            // 食物红色
            ctx.fillStyle="#ff3b30";
            ctx.fillRect(food.x*blockSize, food.y*blockSize, blockSize-1, blockSize-1);

            // 蛇绿色
            ctx.fillStyle="#4cd964";
            snake.forEach(seg=>{
                ctx.fillRect(seg.x*blockSize, seg.y*blockSize, blockSize-1, blockSize-1);
            })
        }

        function update(){
            if(gameOver) return;
            // 新蛇头
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // 撞墙判定
            if(head.x <0 || head.y <0 || head.x >= count || head.y >= count){
                gameOver = true;
                alert(`游戏结束！你的分数：${score}`);
                return;
            }
            // 撞到自己
            for(let seg of snake){
                if(seg.x === head.x && seg.y === head.y){
                    gameOver = true;
                    alert(`游戏结束！你的分数：${score}`);
                    return;
                }
            }

            // 吃到食物
            snake.unshift(head);
            if(head.x === food.x && head.y === food.y){
                score += 10;
                scoreDom.innerText = score;
                food = spawnFood();
                // 分数提升，加快速度，最低40ms
                speed = Math.max(40, 120 - score/2);
            }else{
                snake.pop();
            }
        }

        // 游戏循环
        function gameLoop(){
            update();
            draw();
            if(!gameOver){
                setTimeout(gameLoop, speed);
            }
        }
        gameLoop();
    </script>
</body>
</html>
