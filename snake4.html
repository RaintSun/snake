<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Codex可玩贪吃蛇</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{
            background:#111;
            display:flex;
            flex-direction:column;
            align-items:center;
            padding-top:20px;
            color:#fff;
        }
        .info{
            font-size:22px;
            margin-bottom:8px;
        }
        #gameCanvas{
            border:3px solid #4cd964;
            background:#000;
        }
        .btn-group{
            margin-bottom:12px;
        }
        button{
            padding:8px 18px;
            font-size:18px;
            margin:0 8px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="btn-group">
        <button id="resetBtn">重置游戏</button>
    </div>
    <div class="info">当前分数：<span id="score">0</span></div>
    <div class="info">🏆 最高分：<span id="highScore">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDom = document.getElementById('score');
        const highScoreDom = document.getElementById('highScore');
        const resetBtn = document.getElementById('resetBtn');

        const blockSize = 20;
        const count = canvas.width / blockSize;

        // 全局变量
        let snake, dx, dy, food, score, gameOver, speed;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        highScoreDom.innerText = highScore;

        // 初始化游戏
        function initGame(){
            snake = [{x:10, y:10}];
            dx = 1; dy = 0;
            food = spawnFood();
            score = 0;
            gameOver = false;
            speed = 130; // 放慢速度，给Codex更多思考时间
            scoreDom.innerText = 0;
        }

        // 生成食物（不会生成在蛇身上）
        function spawnFood(){
            let newFood;
            while(true){
                newFood = {
                    x: Math.floor(Math.random() * count),
                    y: Math.floor(Math.random() * count)
                }
                let onSnake = false;
                for(let seg of snake){
                    if(seg.x === newFood.x && seg.y === newFood.y){
                        onSnake = true; break;
                    }
                }
                if(!onSnake) break;
            }
            return newFood;
        }

        // 键盘监听（人手动玩）
        document.addEventListener('keydown', e=>{
            if(gameOver) return;
            switch(e.key){
                case 'ArrowUp':
                    if(dy !== 1) {dx=0; dy=-1;}
                    break;
                case 'ArrowDown':
                    if(dy !== -1) {dx=0; dy=1;}
                    break;
                case 'ArrowLeft':
                    if(dx !== 1) {dx=-1; dy=0;}
                    break;
                case 'ArrowRight':
                    if(dx !== -1) {dx=1; dy=0;}
                    break;
            }
        })

        // 绘图
        function draw(){
            ctx.fillStyle="#000";
            ctx.fillRect(0,0,canvas.width,canvas.height);
            //食物 亮红色，方便Codex识别
            ctx.fillStyle="#ff0000";
            ctx.fillRect(food.x*blockSize, food.y*blockSize, blockSize-1, blockSize-1);
            //蛇 亮绿色
            ctx.fillStyle="#00ff00";
            snake.forEach(seg=>{
                ctx.fillRect(seg.x*blockSize, seg.y*blockSize, blockSize-1, blockSize-1);
            })
            //游戏结束提示文字（画在画布上，不会弹出弹窗）
            if(gameOver){
                ctx.fillStyle="#ff4444";
                ctx.font="24px system-ui";
                ctx.textAlign="center";
                ctx.fillText("GAME OVER", canvas.width/2, canvas.height/2 - 10);
                ctx.fillText("自动重启中...", canvas.width/2, canvas.height/2 +20);
            }
        }

        function update(){
            if(gameOver) return;
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            //撞墙判定
            if(head.x <0 || head.y <0 || head.x >= count || head.y >= count){
                gameOver = true;
                checkHighScore();
                //死亡后1200ms自动重置
                setTimeout(initGame,1200);
                return;
            }
            //撞自己
            for(let seg of snake){
                if(seg.x === head.x && seg.y === head.y){
                    gameOver = true;
                    checkHighScore();
                    //死亡后1200ms自动重置
                    setTimeout(initGame,1200);
                    return;
                }
            }

            snake.unshift(head);
            if(head.x === food.x && head.y === food.y){
                score += 10;
                scoreDom.innerText = score;
                food = spawnFood();
                speed = Math.max(50,130 - score/2);
            }else{
                snake.pop();
            }
        }

        function checkHighScore(){
            if(score > highScore){
                highScore = score;
                localStorage.setItem("snakeHighScore", highScore);
                highScoreDom.innerText = highScore;
            }
        }

        function gameLoop(){
            update();
            draw();
            if(!gameOver){
                setTimeout(gameLoop, speed);
            }else{
                //死亡后继续渲染画面，显示Game Over文字
                setTimeout(gameLoop, 50);
            }
        }

        resetBtn.onclick = initGame;
        initGame();
        gameLoop();
    </script>
</body>
</html>
